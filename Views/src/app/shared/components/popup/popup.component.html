<div class="qx-score" [class]="'qx-score qx-score--' + niveau" role="alertdialog" aria-labelledby="qx-score-titre" aria-describedby="qx-score-message">
  @if (confettis.length) {
    <div class="qx-score__confettis" aria-hidden="true">
      @for (c of confettis; track $index) {
        <span
          [style.left.%]="c.gauche"
          [style.background-color]="c.couleur"
          [style.animation-delay.s]="c.delai"
          [style.animation-duration.s]="c.duree"
          [style.--rotation]="c.rotation + 'deg'"
        ></span>
      }
    </div>
  }

  <div class="qx-score__icone" aria-hidden="true">
    <mat-icon>{{ icone }}</mat-icon>
  </div>

  <h2 id="qx-score-titre" class="qx-score__titre">{{ titre }}</h2>

  <div class="qx-score__anneau">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="qx-score__piste" cx="60" cy="60" r="52" />
      <circle
        class="qx-score__jauge"
        cx="60"
        cy="60"
        r="52"
        [style.stroke-dasharray]="circonference"
        [style.--depart]="circonference"
        [style.--arrivee]="decalage"
      />
    </svg>
    <div class="qx-score__valeur">
      <strong>{{ centre }}</strong>
    </div>
  </div>
  @if (data.legende) {
    <div class="qx-score__legende">{{ data.legende }}</div>
  }

  <p id="qx-score-message" class="qx-score__message">{{ data.message }}</p>

  <button mat-flat-button class="qx-score__bouton" cdkFocusInitial (click)="fermer()">J'ai compris</button>
</div>
