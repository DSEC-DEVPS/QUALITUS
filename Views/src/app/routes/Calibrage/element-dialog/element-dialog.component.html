<div class="container">
  <h6>{{ titre }}</h6>
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" class="form-field-full">
        <div class="row">
          <div class="col-sm-12">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Libelle</mat-label>
              <input matInput formControlName="nom" required />
              @if (form.get('nom')?.invalid && form.get('nom')?.touched) {
                <mat-error>Ce champ est obligatoire</mat-error>
              }
            </mat-form-field>
          </div>

          <div class="col-sm-12">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Poids</mat-label>
              <input
                matInput
                type="number"
                step="0.0001"
                min="0"
                formControlName="poids"
              />
              <mat-hint>Ex : 0.25 (soit 25%)</mat-hint>
            </mat-form-field>
          </div>

          @if (estSousItem) {
            <div class="col-sm-12">
              <mat-form-field appearance="fill" class="w-100">
                <mat-label>Referentiel</mat-label>
                <textarea matInput formControlName="referentiel" rows="4"></textarea>
              </mat-form-field>
            </div>
          }
        </div>

        <div class="m-t-8 text-center">
          <button
            mat-flat-button
            color="primary"
            (click)="valider()"
            [disabled]="form.invalid"
          >
            Valider
          </button>
          <button mat-button mat-dialog-close>Annuler</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
