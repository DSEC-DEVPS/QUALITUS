<div class="container-fluid p-16">
  <mat-card>
    <mat-card-content>
      <div class="d-flex align-items-center justify-content-between flex-wrap m-b-16">
        <h5 class="m-0">Modeles de grille d'evaluation</h5>
        <div class="d-flex" style="gap: 8px">
          <button mat-stroked-button color="primary" (click)="importer()">
            <mat-icon>upload_file</mat-icon> Importer Excel
          </button>
          <button mat-flat-button color="primary" (click)="nouveau()">
            <mat-icon>add</mat-icon> Nouveau modele
          </button>
        </div>
      </div>

      <mat-form-field appearance="outline" class="w-100 m-b-8">
        <mat-label>Rechercher</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Nom du modele..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="mat-elevation-z1" style="overflow-x: auto">
        <table mat-table [dataSource]="dataSource" matSort class="w-100">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
            <td mat-cell *matCellDef="let m">{{ m.id }}</td>
          </ng-container>

          <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
            <td mat-cell *matCellDef="let m">{{ m.nom }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let m">{{ m.description }}</td>
          </ng-container>

          <ng-container matColumnDef="Etat">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Etat</th>
            <td mat-cell *matCellDef="let m">
              <mat-chip-set>
                <mat-chip>{{ m.Etat }}</mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="dateCreation">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cree le</th>
            <td mat-cell *matCellDef="let m">{{ m.dateCreation | date: 'dd/MM/yyyy' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let m">
              <button
                mat-icon-button
                color="primary"
                matTooltip="Editer la grille"
                (click)="editer(m)"
              >
                <mat-icon>edit_note</mat-icon>
              </button>
              <button
                mat-icon-button
                matTooltip="Associer des categories de ressources"
                (click)="associer(m)"
              >
                <mat-icon>group_work</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                matTooltip="Supprimer"
                (click)="supprimer(m)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center p-16" [attr.colspan]="displayedColumns.length">
              Aucun modele de grille pour le moment.
            </td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
