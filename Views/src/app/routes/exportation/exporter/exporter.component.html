<mat-card>
  <mat-card-header></mat-card-header>
  <mat-card-content>
    <div class="export-container" [formGroup]="exportForm">
      <mat-card class="export-card">
        <mat-card-title style="font-size: medium">Exporter des Données</mat-card-title>
        <mat-card-subtitle style="font-size: small; color: #ff8e36"
          >Sélectionnez vos filtres, visualisez un aperçu, puis exportez.</mat-card-subtitle
        >

        <mat-divider></mat-divider>

        <div class="export-form-fields">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Type de données</mat-label>
            <mat-select formControlName="dataType">
              <ng-template *ngFor="let item of type_donnes" [ngxPermissionsOnly]="item.permissions">
                <mat-option [value]="item.label">{{ item.label }}</mat-option>
              </ng-template>
              <!-- Exports Évaluation : seuls ceux autorisés par le serveur -->
              <mat-option *ngFor="let t of contexte?.types || []" [value]="t.code">{{ t.libelle }}</mat-option>
            </mat-select>
          </mat-form-field>

          <ng-container *ngIf="typeEval">
            <mat-form-field appearance="outline" class="full-width" *ngIf="contexte?.vision_globale">
              <mat-label>Site</mat-label>
              <mat-select formControlName="id_site">
                <mat-option value="TOUS">Tous les sites</mat-option>
                <mat-option *ngFor="let s of contexte?.sites || []" [value]="s.id">{{ s.nom }}</mat-option>
              </mat-select>
            </mat-form-field>
            <p class="site-impose" *ngIf="!contexte?.vision_globale">
              <mat-icon>location_on</mat-icon> Site : <strong>{{ siteImpose }}</strong>
            </p>
            <mat-form-field appearance="outline" class="full-width" *ngIf="typeEval.code === 'AGENTS'">
              <mat-label>Statut</mat-label>
              <mat-select formControlName="statut">
                <mat-option *ngFor="let st of statuts" [value]="st.valeur">{{ st.libelle }}</mat-option>
              </mat-select>
            </mat-form-field>
          </ng-container>

          <div class="date-range-fields" *ngIf="avecDates">
            <mat-form-field appearance="outline">
              <mat-label>Début</mat-label>
              <input matInput [matDatepicker]="startPicker" formControlName="dateDebut" />
              <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
              <mat-datepicker #startPicker></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Fin</mat-label>
              <input matInput [matDatepicker]="endPicker" formControlName="dateFin" />
              <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
              <mat-datepicker #endPicker></mat-datepicker>
            </mat-form-field>
          </div>

          <mat-slide-toggle formControlName="isActive" color="orange" *ngIf="!typeEval"
            >Utilisateurs actifs</mat-slide-toggle
          >

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Format d'export</mat-label>
            <mat-select formControlName="format">
              <mat-option *ngFor="let f of formats" [value]="f">{{ f }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>
        <div class="export-buttons">
          <button mat-raised-button color="primary" (click)="onPreview()">
            <mat-icon>visibility</mat-icon> Aperçu
          </button>
          <button
            mat-raised-button
            [disabled]="exportForm.invalid || isLoading"
            color="accent"
            (click)="onExport()"
          >
            <mat-icon>download</mat-icon> Exporter
          </button>
        </div>
      </mat-card>
    </div>
  </mat-card-content>
</mat-card>
