<div class="container">
  <h6>Nouvel Calendrier</h6>
  <div class="row m-auto justify-content-center register-template">
    <div class="col-sm-8">
      <mat-card>
        <mat-card-content>
          <form [formGroup]="formGroup" (ngSubmit)="createCalendars()" class="form-field-full">
            <div class="row">
              <div class="col-sm-6 m-auto">
                <mat-form-field appearance="fill">
                  <mat-label>Date de début</mat-label>
                  <input
                    matInput
                    [matDatepicker]="pickerDebut"
                    formControlName="date_debut"
                    required
                  />
                  <mat-datepicker-toggle matSuffix [for]="pickerDebut"></mat-datepicker-toggle>
                  <mat-datepicker #pickerDebut></mat-datepicker>
                </mat-form-field>
              </div>
            </div>
            <div class="row">
              <div class="col-sm-6 m-auto">
                <mat-form-field appearance="fill">
                  <mat-label>Date de fin</mat-label>
                  <input matInput [matDatepicker]="pickerFin" formControlName="date_fin" required />
                  <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
                  <mat-datepicker #pickerFin></mat-datepicker>
                </mat-form-field>
              </div>
            </div>
            <div class="row">
              <div class="col-sm-6 m-auto">
                <mat-form-field appearance="fill">
                  <mat-label>Site</mat-label>
                  <mat-select formControlName="id_Site" required>
                    <mat-option *ngFor="let site of sites" [value]="site.id">
                      {{ site.nom }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
            
            <div class="m-t-8 text-center">
              <button
                mat-flat-button
                [loading]="isSubmitting"
                [disabled]="formGroup.invalid"
              >
                Ajouter
              </button>
              <button mat-button mat-dialog-close>Annuler</button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
