<mat-card>
  <mat-card-header>
    <div class="container pb-3">
      <div class="row justify-content-space-between">
        <div class="col-sm-6 text-start p-0">
          <h3>Politique du calendrier</h3>
        </div>
        <div class="col-sm-6 text-end p-0">
          <div class="btn btn-light align-items-center delete_button" (click)="openAddDialog()">
            <mat-icon
              class="add_icon"
              matTooltip="Ajouter un calendrier"
              matTooltipPosition="above"
            >
              add_circle
            </mat-icon>
          </div>
        </div>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="mat-elevation-z6">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="Site">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="">Site</th>
          <td mat-cell *matCellDef="let element">
            {{ element.nom }}
          </td>
        </ng-container>
        <ng-container matColumnDef="Politique">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="">Politique</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.calendars[0]?.mois_courant_et_posterieurs == 1" class="text_etat">
              Mois courant et posterieurs
            </span>
            <span *ngIf="element.calendars[0]?.mois_courant == 1" class="text_etat">
              Mois courant
            </span>
            <span *ngIf="element.calendars[0]?.tous_les_mois == 1" class="text_etat">
              Tous les mois
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="dateCreation">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="">Date Création</th>
          <td mat-cell *matCellDef="let element">
            {{ element.calendars[0]?.date_creation | date: 'dd-MM-yyyy' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
          <td mat-cell *matCellDef="let element">
            <div class="ACTIONS">
              <mat-icon
                (click)="openEditDialog(element.calendars[0])"
                class="mat_icon_edit"
                matTooltip="modifier"
                matTooltipPosition="above"
                >edit</mat-icon
              >
              <mat-icon
                (click)="deletePolicies(element.calendars[0]?.id)"
                class="delete_icon"
                matTooltip="supprimer"
                matTooltipPosition="above"
                >delete_forever</mat-icon
              >
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColums"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColums"></tr>
        <!-- <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
        </tr> -->
      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of users"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
