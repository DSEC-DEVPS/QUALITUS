<div class="container">
  <h2 class="dlg-titre">Nouveau motif</h2>
  <div class="row m-auto justify-content-center register-template">
    <div class="col-sm-8">
      <mat-card>
        <mat-card-content>
          <form [formGroup]="formMotifMaVoixCompte" class="form-field-full" (ngSubmit)="formMotifMaVoixCompte.valid && handleOnSumit()">
            <div class="d-block">
              <div class="col-sm-6 col-md-6 m-auto">
                <mat-form-field appearance="fill">
                  <mat-label>Nom du motif</mat-label>
                  <input matInput formControlName="nom" required cdkFocusInitial />
                  @if (formMotifMaVoixCompte.get('nom')?.invalid) {
                    <mat-error>Ce champ est obligatoire</mat-error>
                  }
                </mat-form-field>
              </div>
            </div>

            <div class="m-t-8 text-center">
              <button
                mat-flat-button
                type="submit"
                [loading]="isSubmitting"
                [disabled]="formMotifMaVoixCompte.invalid"
              >
                Ajouter
              </button>
              <button mat-button type="button" mat-dialog-close>Annuler</button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
