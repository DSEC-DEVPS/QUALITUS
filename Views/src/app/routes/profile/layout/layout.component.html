<div class="profil-page">
  <div class="profil-bandeau">
    <img class="pb-avatar" [src]="imageUrl" alt="" />
    <div class="pb-id">
      <h2>{{ nomComplet }}</h2>
      <div class="pb-login">{{ user?.name }}</div>
      <div class="pb-badges">
        @if (user?.fonction) { <span class="pb-badge fonction"><mat-icon>badge</mat-icon>{{ user.fonction }}</span> }
        @if (user?.site) { <span class="pb-badge"><mat-icon>place</mat-icon>{{ user.site }}</span> }
        @if (user?.programme) { <span class="pb-badge"><mat-icon>work_outline</mat-icon>{{ user.programme }}</span> }
      </div>
    </div>
  </div>

  <div class="profil-corps">
    <nav class="profil-nav">
      <a routerLink="/mon-espace/profile/overview" routerLinkActive="actif">
        <mat-icon>account_circle</mat-icon> Mes informations
      </a>
      <a routerLink="/mon-espace/profile/settings" routerLinkActive="actif">
        <mat-icon>lock_reset</mat-icon> Changer mon mot de passe
      </a>
      <div class="pn-sep"></div>
      <a class="deconnexion" (click)="logout()" (keydown.enter)="logout()" tabindex="0">
        <mat-icon>logout</mat-icon> Se déconnecter
      </a>
    </nav>
    <div class="profil-contenu">
      <router-outlet />
    </div>
  </div>
</div>
