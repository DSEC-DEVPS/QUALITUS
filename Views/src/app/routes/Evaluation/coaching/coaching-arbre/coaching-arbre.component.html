<div class="coaching-arbre">
  <mat-card class="cal-panel"><mat-card-header class="cal-band"><span class="cal-band-title"><mat-icon>account_tree</mat-icon> Arbre de coaching (5 pourquoi — unique)</span></mat-card-header><mat-card-content>

  

  @if (chargement) { <app-chargement /> }
  @else {
    <app-arbre-options [options]="options" [modifiable]="peutParametrer"
                       (ajouter)="ajouterOptionArbre($event)" (renommer)="renommerOptionArbre($event)"
                       (supprimer)="supprimerOptionArbre($event)" (deplacer)="deplacerOptionArbre($event)" />
  }
</mat-card-content></mat-card>
</div>
