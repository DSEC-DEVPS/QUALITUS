<div class="referentiels">
  <mat-card class="cal-panel"><mat-card-header class="cal-band"><span class="cal-band-title"><mat-icon>list_alt</mat-icon> Référentiels d'évaluation</span></mat-card-header><mat-card-content>

  

  <mat-button-toggle-group [value]="typeActif" class="types">
    @for (t of types; track t.key) {
      <mat-button-toggle [value]="t.key" (click)="changerType(t.key)">{{ t.label }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  <mat-card>
    <mat-card-content>
      <div class="ajout">
        <mat-form-field appearance="outline" class="lib"><mat-label>Nouveau libellé</mat-label>
          <input matInput [(ngModel)]="nouveau.libelle" name="nl" (keyup.enter)="ajouter()" /></mat-form-field>
        <mat-form-field appearance="outline" class="desc"><mat-label>Description (facultative)</mat-label>
          <input matInput [(ngModel)]="nouveau.description" name="nd" /></mat-form-field>
        <mat-form-field appearance="outline" class="ord"><mat-label>Ordre</mat-label>
          <input matInput type="number" [(ngModel)]="nouveau.ordre" name="no" /></mat-form-field>
        <button mat-raised-button color="primary" (click)="ajouter()"><mat-icon>add</mat-icon> Ajouter</button>
      </div>

      @if (items.length === 0) {
        <p class="vide">Aucun élément.</p>
      } @else {
        <table mat-table [dataSource]="items" class="table">
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef>Libellé</th>
            <td mat-cell *matCellDef="let it" [class.inactif]="it.etat === 'INACTIF'">
              <mat-form-field appearance="outline" class="edit"><input matInput [(ngModel)]="it.libelle" [name]="'l'+it.id" (blur)="enregistrer(it)" /></mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let it">
              <mat-form-field appearance="outline" class="edit"><input matInput [(ngModel)]="it.description" [name]="'d'+it.id" (blur)="enregistrer(it)" /></mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="ordre">
            <th mat-header-cell *matHeaderCellDef>Ordre</th>
            <td mat-cell *matCellDef="let it">
              <mat-form-field appearance="outline" class="mini"><input matInput type="number" [(ngModel)]="it.ordre" [name]="'o'+it.id" (blur)="enregistrer(it)" /></mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="etat">
            <th mat-header-cell *matHeaderCellDef>Actif</th>
            <td mat-cell *matCellDef="let it">
              <mat-slide-toggle [checked]="it.etat !== 'INACTIF'" (change)="basculerEtat(it)"
                                matTooltip="Une entrée inactive n'apparaît plus dans les listes mais reste sur l'historique"></mat-slide-toggle>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let it"><button mat-icon-button color="warn" (click)="supprimer(it)"><mat-icon>delete</mat-icon></button></td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
          <tr mat-row *matRowDef="let row; columns: colonnes"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</mat-card-content></mat-card>
</div>
