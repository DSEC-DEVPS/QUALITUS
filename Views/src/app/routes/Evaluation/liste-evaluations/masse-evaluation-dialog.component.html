<div class="container">
  <h6>Creation en masse d'evaluations</h6>
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" class="form-field-full">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Agents a evaluer</mat-label>
          <mat-select formControlName="agents" multiple required>
            @for (a of agents; track a.id) {
              <mat-option [value]="a.id">{{ a.nom }} {{ a.prenom }} ({{ a.login_genesys }})</mat-option>
            }
          </mat-select>
          <mat-hint>Une evaluation sera creee pour chaque agent selectionne.</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Contexte</mat-label>
          <mat-select formControlName="id_Contexte" required>
            @for (c of contextes; track c.id) {
              <mat-option [value]="c.id">{{ c.libelle }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Motif d'appel (commun, optionnel)</mat-label>
          <input matInput formControlName="motif_appel" />
        </mat-form-field>

        <div class="m-t-8 text-center">
          <button mat-flat-button color="primary" (click)="creer()" [disabled]="form.invalid || isSubmitting">
            Creer les evaluations
          </button>
          <button mat-button mat-dialog-close>Annuler</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
