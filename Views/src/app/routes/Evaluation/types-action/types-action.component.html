<div class="container-fluid p-16">
  <mat-card>
    <mat-card-content>
      <div class="d-flex align-items-center justify-content-between flex-wrap m-b-16">
        <h5 class="m-0">Types d'action (plan d'action)</h5>
        <button mat-flat-button color="primary" (click)="ajouter()">
          <mat-icon>add</mat-icon> Nouveau type
        </button>
      </div>
      <div style="overflow-x: auto">
        <table mat-table [dataSource]="dataSource" class="w-100">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let t">{{ t.id }}</td>
          </ng-container>
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef>Libelle</th>
            <td mat-cell *matCellDef="let t">{{ t.libelle }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let t">
              <button mat-icon-button color="primary" (click)="modifier(t)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button color="warn" (click)="supprimer(t)"><mat-icon>delete</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
          <tr mat-row *matRowDef="let row; columns: colonnes"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center p-16" [attr.colspan]="colonnes.length">Aucun type d'action.</td>
          </tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
