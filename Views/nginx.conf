worker_processes auto;

events {
    # out113 : 700 utilisateurs (plusieurs connexions chacun)
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # out113 : compression des réponses (API JSON, scripts, styles) : 5 à 10 fois moins de données
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/xml;

    # Connexions réutilisées vers l'API (au lieu d'une nouvelle connexion par requête)
    upstream api_qualitus {
        server server:3000;
        keepalive 64;
    }

    server {
        listen 0.0.0.0:80;
        server_name 192.168.85.139;
        root /usr/share/nginx/html;
        index index.html;

        # Gestion des routes Angular ; index.html jamais mis en cache (nouvelle version visible aussitôt)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        # Fichiers de l'application dont le nom contient une empreinte (main-XXXX.js…) : cache long
        location ~* "-[A-Za-z0-9]{8,}\.(js|css)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location ~* \.(woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Fichiers des fiches : servis directement par nginx depuis le volume partagé
        # (plus de passage par l'API) ; repli sur l'API si le volume n'est pas monté.
        location ^~ /chargements/ {
            root /srv;
            try_files $uri @chargements_api;
            expires 1h;
        }
        location @chargements_api {
            proxy_pass http://api_qualitus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy vers l'API
        location ^~ /api/ {
            proxy_pass http://api_qualitus/api/;
            client_max_body_size 100M;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # exports et rapports volumineux
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
