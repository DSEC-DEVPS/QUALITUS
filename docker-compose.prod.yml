
services:
  db:
    image: mysql:8
    command:
      - "--lower_case_table_names=1"
      - "--max_connections=400"
      - "--innodb_buffer_pool_size=4G"
      - "--slow_query_log=1"
      - "--long_query_time=1"
      - "--slow_query_log_file=/var/lib/mysql/lent.log"    
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: QUALITUS
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/0_init.sql
      - db-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - internalnet

  adminer:
    image: adminer
    restart: always
    ports:
      - "8000:8080"
    depends_on:
      - db
    networks:
      - internalnet

  server:
    image: diack500/qualitus-backend-v2
    restart: always
    command: ["./wait-for-it.sh", "db:3306", "--", "node", "server.js"]
    environment:
      NODE_OPTIONS: "--unhandled-rejections=warn"
            # Ajout du json contenant les variables d'environnement: journal limité aux erreurs et requêtes lentes, pool MySQL, secret des jetons
      NODE_ENV: production
      # Definitions du nombre de processus a demarrer en prod: 4 processus Node x 30 connexions = 120 connexions MySQL au plus
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: QUALITUS
    ports:
      - "3000:3000"
    volumes:
      - chargements:/app/chargements
    depends_on:
      - db
    networks:
      - internalnet

  view:
    image: diack500/qualitus-frontend-v2
    restart: always
    ports:
      - "3333:80"
    # Ajout du volume chargement afin qu'on servent les fiche depuis nginx, au lieu de passer par node à chaque fois
    volumes:
      - chargements:/app/chargements
    depends_on:
      - server
    networks:
      - internalnet

volumes:
  db-data:
  chargements:

networks:
  internalnet:
    driver: bridge
