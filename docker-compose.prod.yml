
services:
  db:
    image: mysql:8
    command: --lower-case-table-names=1
    restart: always
    command: ["--lower_case_table_names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: QUALITUS
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/0_init.sql
      - db-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - internalnet

  adminer:
    image: adminer
    restart: always
    ports:
      - "8000:8080"
    depends_on:
      - db
    networks:
      - internalnet

  server:
    image: diack500/qualitus-backend-v2
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: QUALITUS
    ports:
      - "3000:3000"
    volumes:
      - chargements:/app/chargements
    depends_on:
      - db
    networks:
      - internalnet

  view:
    image: diack500/qualitus-frontend-v2
    restart: always
    ports:
      - "3333:80"
    depends_on:
      - server
    networks:
      - internalnet

volumes:
  db-data:
  chargements:

networks:
  internalnet:
    driver: bridge
